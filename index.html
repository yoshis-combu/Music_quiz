const SET_SIZE = 15;
const STORE_KEY = "bunraku_stats";
const DAY = 86400000;

/* ---------- 永続化（localStorage が使えなくても落ちない） ---------- */
let stats = {};
let storageOK = true;
function loadStats(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    const o = raw ? JSON.parse(raw) : {};
    stats = (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
  }catch(e){ storageOK = false; stats = {}; }
}
function saveStats(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(stats)); return true; }
  catch(e){ storageOK = false; return false; }
}
function clearStats(){
  stats = {};
  try{ localStorage.removeItem(STORE_KEY); }catch(e){ storageOK = false; }
}
function getStat(id){
  const s = stats[id];
  return s && typeof s.attempts === "number" ? s : {attempts:0, wrong:0, lastCorrect:null, lastSeen:0};
}
function record(id, correct){
  const s = getStat(id);
  stats[id] = {attempts:s.attempts+1, wrong:s.wrong+(correct?0:1), lastCorrect:!!correct, lastSeen:Date.now()};
  if(!saveStats() && !record.warned){ record.warned = true; toast("保存できないため、この記録は今回のみ有効です"); }
}

/* ---------- 重み付き抽選 ---------- */
function weight(q, now){
  const s = getStat(q.id);
  if(s.attempts === 0) return 100;                        // 未出題を最優先
  const rate = s.wrong / s.attempts;
  const days = Math.min((now - (s.lastSeen||0)) / DAY, 30);
  let w = 1 + s.wrong*4 + rate*10 + days*0.5;              // 誤答多い・久しぶりほど高い
  if(s.lastCorrect === false) w += 3;
  return w;
}
function pickSet(pool, n){
  const now = Date.now();
  const items = pool.map(q => ({q, w: weight(q, now)}));
  const out = [];
  n = Math.min(n, items.length);
  while(out.length < n){
    let total = 0; for(const it of items) total += it.w;
    let r = Math.random() * total, idx = items.length - 1;
    for(let i=0;i<items.length;i++){ r -= items[i].w; if(r <= 0){ idx = i; break; } }
    out.push(items[idx].q.id);
    items.splice(idx,1);                                   // 重複なし
  }
  return out;
}

/* ---------- 小道具 ---------- */
const $app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(k === "class") e.className = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) e.setAttribute(k, v);
  }
  for(const c of kids.flat()){ if(c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
const byId = {}; QUESTIONS.forEach(q => byId[q.id] = q);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

/* ---------- 状態 ---------- */
let tab = "home";
let session = null;   // {ids, idx, correct, cur:{idx,order,picked}, wrongIds, label, done}

function startSet(pool, label){
  if(!pool.length){ toast("出題できる問題がありません"); return; }
  session = {ids: pickSet(pool, SET_SIZE), idx:0, correct:0, cur:null, wrongIds:[], label, done:false};
  go("quiz");
}
function go(t){
  tab = t; render();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  window.scrollTo(0,0);
}
function wrongPool(){ return QUESTIONS.filter(q => getStat(q.id).wrong > 0); }
function render(){
  $app.replaceChildren();
  if(tab === "home") viewHome();
  else if(tab === "quiz") viewQuiz();
  else if(tab === "review") viewReview();
  else viewStats();
}

/* ---------- ホーム ---------- */
function totals(){
  let att = 0, wr = 0, seen = 0;
  for(const q of QUESTIONS){ const s = getStat(q.id); att += s.attempts; wr += s.wrong; if(s.attempts) seen++; }
  return {att, wr, seen};
}
function viewHome(){
  const t = totals();
  $app.append(
    h("h1",null,"文楽クイズ"),
    h("p",{class:"sub"},"中3 音楽の定期試験対策。文楽（人形浄瑠璃）の問題に挑戦しよう。"),
    h("div",{class:"card"},
      h("h2",null,"1セット " + Math.min(SET_SIZE, QUESTIONS.length) + " 問"),
      h("p",{class:"sub"},"未出題・苦手な問題が出やすくなります。繰り返すと全 " + QUESTIONS.length + " 問を網羅できます。"),
      h("div",{class:"stats3"},
        h("div",{class:"stat"},h("b",null,t.seen + "/" + QUESTIONS.length),"出題済み"),
        h("div",{class:"stat"},h("b",null,t.att ? pct(t.att-t.wr,t.att) + "%" : "-"),"正答率"),
        h("div",{class:"stat"},h("b",null,wrongPool().length),"苦手問題")),
      h("button",{class:"btn",onclick:()=>startSet(QUESTIONS,"全問")},"クイズを始める"))
  );
  if(!storageOK) $app.append(h("div",{class:"card sub"},"この環境では記録を保存できません（ページを閉じると消えます）。"));
}

/* ---------- クイズ ---------- */
function shuffled4(n){
  const a = Array.from({length:n}, (_,i) => i);
  for(let i=n-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
// 現在の設問の状態（表示順・選択した表示位置）。タブ往復しても保持する
function curState(){
  if(!session.cur || session.cur.idx !== session.idx){
    const q = byId[session.ids[session.idx]];
    session.cur = {idx: session.idx, order: shuffled4(q.choices.length), picked: -1};
  }
  return session.cur;
}
function viewQuiz(){
  if(!session){ viewHome(); return; }
  if(session.done){ viewResult(); return; }
  const q = byId[session.ids[session.idx]];
  const cur = curState();
  const total = session.ids.length;
  const card = h("div",{class:"card"});
  card.append(
    h("div",{class:"sub"},session.label + "　" + (session.idx+1) + " / " + total),
    h("div",{class:"bar"},h("i",{style:"display:block;width:" + (session.idx/total*100) + "%"})),
    h("span",{class:"cat"},q.cat),
    h("div",{class:"q"},q.q)
  );
  if(q.img){
    const img = h("img",{class:"fig",src:"assets/img/" + q.img + ".png",alt:"教科書の図（補助）"});
    img.addEventListener("error", () => img.remove());   // 画像は補助。失敗しても設問は成立
    card.append(img);
  }
  // 表示位置 k には元の選択肢 cur.order[k] を出す。正解の表示位置は元の answer の移動先
  const btns = cur.order.map((orig,k) => h("button",{class:"choice",type:"button",onclick:()=>answer(k)},q.choices[orig]));
  card.append(...btns);
  $app.append(card);
  if(cur.picked >= 0) showResult(card, btns, q, cur);    // 解答済みで戻った場合は施錠表示を復元
}
function showResult(card, btns, q, cur){
  const correctPos = cur.order.indexOf(q.answer);
  const ok = cur.picked === correctPos;
  btns.forEach((b,k) => {
    b.disabled = true;
    if(k === correctPos) b.classList.add("ok");
    else if(k === cur.picked) b.classList.add("ng");
    else b.classList.add("dim");
  });
  const last = session.idx === session.ids.length - 1;
  card.append(
    h("div",{class:"explain" + (ok?"":" ng")},h("strong",null,ok?"⭕ 正解！":"❌ 不正解（正解：" + q.choices[q.answer] + "）"),q.explain),
    h("button",{class:"btn",type:"button",onclick:()=>{
      if(last) session.done = true; else session.idx++;
      session.cur = null;
      render(); window.scrollTo(0,0);
    }},last ? "結果を見る" : "次の問題へ")
  );
}
function answer(k){
  const cur = curState();
  if(cur.picked >= 0) return;
  const q = byId[session.ids[session.idx]];
  cur.picked = k;
  const ok = k === cur.order.indexOf(q.answer);
  if(ok) session.correct++; else session.wrongIds.push(q.id);
  record(q.id, ok);
  render();   // 同じ状態から施錠表示を描画（再シャッフルしない）
}
function viewResult(){
  const n = session.ids.length;
  const wrongQs = session.wrongIds.map(id => byId[id]);
  $app.append(
    h("div",{class:"card"},
      h("h2",null,"結果"),
      h("div",{class:"stats3"},
        h("div",{class:"stat"},h("b",null,session.correct + " / " + n),"正解"),
        h("div",{class:"stat"},h("b",null,pct(session.correct,n) + "%"),"正答率"),
        h("div",{class:"stat"},h("b",null,wrongQs.length),"誤答")),
      wrongQs.length
        ? h("div",null,h("p",{class:"sub"},"間違えた問題"),h("ul",null,wrongQs.map(q => h("li",null,q.q))))
        : h("p",null,"全問正解！おめでとう 🎉"),
      h("div",{class:"row"},
        h("button",{class:"btn",onclick:()=>startSet(QUESTIONS,"全問")},"もう1セット"),
        h("button",{class:"btn sec",onclick:()=>{session=null;go("home");}},"ホームへ")))
  );
}

/* ---------- 復習 ---------- */
function viewReview(){
  const list = wrongPool().map(q => ({q, s:getStat(q.id)}))
    .sort((a,b) => (b.s.wrong/b.s.attempts) - (a.s.wrong/a.s.attempts) || b.s.wrong - a.s.wrong);
  $app.append(h("h1",null,"復習（強化ポイント）"));
  if(!list.length){
    $app.append(h("div",{class:"card empty"},"まだ誤答はありません。クイズに挑戦しよう"));
    return;
  }
  $app.append(
    h("button",{class:"btn",onclick:()=>startSet(list.map(x=>x.q),"復習")},"誤答した問題で出題（最大" + SET_SIZE + "問）"),
    h("p",{class:"sub"},"誤答率の高い順（" + list.length + "問）")
  );
  for(const {q,s} of list){
    $app.append(h("div",{class:"card"},
      h("span",{class:"cat"},q.cat),
      h("div",{class:"q"},q.q),
      h("div",{class:"sub"},"誤答 " + s.wrong + " / 出題 " + s.attempts + "（誤答率 " + pct(s.wrong,s.attempts) + "%）"),
      h("div",{class:"explain"},h("strong",null,"正解：" + q.choices[q.answer]),q.explain)));
  }
}

/* ---------- 統計 ---------- */
function viewStats(){
  const t = totals();
  const rows = QUESTIONS.map(q => ({q, s:getStat(q.id)}));
  $app.append(
    h("h1",null,"統計"),
    h("div",{class:"card"},
      h("div",{class:"stats3"},
        h("div",{class:"stat"},h("b",null,t.att),"出題総数"),
        h("div",{class:"stat"},h("b",null,t.att - t.wr),"正解数"),
        h("div",{class:"stat"},h("b",null,t.att ? pct(t.att-t.wr,t.att) + "%" : "-"),"全体の正答率"))),
    h("div",{class:"card"},
      h("h2",null,"問題別"),
      h("div",{class:"tablewrap"},h("table",null,
        h("thead",null,h("tr",null,h("th",null,"問題"),h("th",null,"出題"),h("th",null,"誤答"),h("th",null,"誤答率"))),
        h("tbody",null,rows.map(({q,s}) => h("tr",null,
          h("td",null,q.q),
          h("td",null,s.attempts),
          h("td",null,s.wrong),
          h("td",{class:s.attempts && s.wrong/s.attempts >= 0.5 ? "rate-hi" : ""},s.attempts ? pct(s.wrong,s.attempts) + "%" : "-")))))),
      h("button",{class:"btn danger",onclick:()=>{
        if(confirm("累積の記録をすべて消去します。よろしいですか？")){
          clearStats(); toast("累積をリセットしました"); render();
        }
      }},"累積をリセット"))
  );
}

/* ---------- 起動 ---------- */
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  const t = b.dataset.tab;
  if(t === "quiz" && !session){ startSet(QUESTIONS,"全問"); return; }
  go(t);
}));
loadStats();
go("home");
</script>
